name: Talkify Backend CI

on:
  push:
    branches:
      - main
      - bhavesh
    paths:
      - "backend/**"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build backend
        working-directory: backend
        run: mvn clean install -DskipTests
