name: Talkify Backend CI/CD

on:
  push:
    branches:
      - main
      - bhavesh
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  backend-ci-cd:
    runs-on: ubuntu-latest

    steps:

      # ===============================
      # STEP 1 — Checkout code
      # ===============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===============================
      # STEP 2 — Setup Java
      # ===============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ===============================
      # STEP 3 — Build backend JAR
      # ===============================
      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      # ===============================
      # STEP 4 — Docker login
      # ===============================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ===============================
      # STEP 5 — Build Docker image
      # ===============================
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/talkify-backend:latest ./backend

      # ===============================
      # STEP 6 — Push Docker image
      # ===============================
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/talkify-backend:latest

      # ===============================
      # STEP 7 — Deploy to AWS EC2
      # ===============================
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/talkify-backend:latest

            docker stop talkify-backend || true
            docker rm talkify-backend || true

            docker run -d \
              --name talkify-backend \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/talkify-backend:latest
